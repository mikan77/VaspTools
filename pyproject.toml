[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "VaspTools"
version = "0.1.0"
description = "Python API for preparing and post-processing VASP mechanical-property workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Mihail Averanov" }
]
keywords = [
  "vasp",
  "mechanical-properties",
  "elastic-tensor",
  "equation-of-state",
  "bulk-modulus",
  "molecular-crystals",
  "pymatgen"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics"
]
dependencies = [
  "numpy",
  "scipy",
  "pymatgen",
]

[project.urls]
Homepage = "https://github.com/mihailaveranov/VaspTools"
Issues = "https://github.com/mihailaveranov/VaspTools/issues"

[tool.setuptools]
packages = [
  "VaspTools",
  "VaspTools.analysis",
  "VaspTools.core",
  "VaspTools.execution",
  "VaspTools.io",
  "VaspTools.structures",
  "VaspTools.workflows",
]
package-dir = { "VaspTools" = "." }
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
